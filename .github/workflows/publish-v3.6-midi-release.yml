# Triggered by the v3.6 release package commit.
name: Publish v3.6 MIDI release

on:
  push:
    branches: [main]
    paths:
      - "dist/releases/reaper-trackpadengine-v3.6-midi-arm64.zip"
      - ".github/workflows/publish-v3.6-midi-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6-midi-arm64
          name: "v3.6 MIDI — Apple Silicon"
          target_commitish: main
          generate_release_notes: false
          body: |
            Apple Silicon release for REAPER on macOS.

            Highlights:
            - smooth Arrange-view navigation;
            - precise two-finger panning inside the MIDI editor;
            - MIDI pinch zoom anchored at the mouse cursor;
            - requires js_ReaScriptAPI via ReaPack.

            See README and CHANGELOG for installation and details.
          files: dist/releases/reaper-trackpadengine-v3.6-midi-arm64.zip
          fail_on_unmatched_files: true
